name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true

permissions:
  contents: write

jobs:
  # One job per bundle format. Each builds on a runner that can actually produce it:
  # an .msi cannot be made on Linux and a .dmg cannot be made on Windows.
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 (NSIS installer)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: Windows x64 (MSI)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
          - label: Windows ARM64 (NSIS installer)
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - label: macOS Apple Silicon (DMG)
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - label: macOS Intel (DMG)
            # macos-13 is being retired, so the Intel build cross-compiles from an
            # Apple Silicon runner: the x86_64-apple-darwin std is installed by
            # dtolnay/rust-toolchain and the binary is produced normally.
            os: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
          - label: Linux x64 (AppImage)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - label: Linux x64 (deb)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - label: Linux ARM64 (AppImage)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}-${{ matrix.bundles }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the tauri cli
        run: npm install --no-audit --no-fund
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libayatana-appindicator3-dev is the maintained tray indicator; installing
          # libappindicator3-dev alongside it makes apt fail with a conflict.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev
      - name: Verify the frontend self-test
        run: node tools/ui-selftest.mjs
      - name: Build
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect the installers
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ matrix.bundles }}
          path: |
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Everything is gathered into one release so a user picks a file, not a workflow run.
  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Work out the tag
        id: meta
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            # Take only the section that matches the tag being released.
            awk -v tag="$TAG" '
              $0 ~ "^## " tag { grab = 1; next }
              grab && /^## / { exit }
              grab { print }
            ' CHANGELOG.md > "$notes"
          fi
          if [ ! -s "$notes" ]; then
            printf 'See the [changelog](%s/blob/%s/CHANGELOG.md) for details.\n' \
              "$REPO" "$TAG" > "$notes"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" --title "Tasma $TAG" --notes-file "$notes" --verify-tag artifacts/*
          fi
