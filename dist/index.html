<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tasma</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Icon sprite: inline so the app never waits on an icon font or a network fetch.
       Strokes inherit currentColor and are set up in styles.css. -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-cpu" viewBox="0 0 16 16"><rect x="4.2" y="4.2" width="7.6" height="7.6" rx="2"/><path d="M6.5 1.5v2.7M9.5 1.5v2.7M6.5 11.8v2.7M9.5 11.8v2.7M1.5 6.5h2.7M1.5 9.5h2.7M11.8 6.5h2.7M11.8 9.5h2.7"/></symbol>
      <symbol id="i-gpu" viewBox="0 0 16 16"><rect x="1.5" y="3.5" width="13" height="9" rx="2"/><circle cx="6" cy="8" r="2.4"/><path d="M10.6 6.2h2.2M10.6 9.8h2.2"/></symbol>
      <symbol id="i-memory" viewBox="0 0 16 16"><rect x="1.5" y="4" width="13" height="8" rx="1.6"/><path d="M4.6 6.4v3.2M8 6.4v3.2M11.4 6.4v3.2M5 12v2M11 12v2"/></symbol>
      <symbol id="i-disk" viewBox="0 0 16 16"><ellipse cx="8" cy="4.3" rx="5.5" ry="2.3"/><path d="M2.5 4.3v7.4c0 1.3 2.5 2.3 5.5 2.3s5.5-1 5.5-2.3V4.3"/><path d="M2.5 8c0 1.3 2.5 2.3 5.5 2.3S13.5 9.3 13.5 8"/></symbol>
      <symbol id="i-network" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2"/><path d="M4.2 4.2a5.4 5.4 0 0 0 0 7.6M11.8 11.8a5.4 5.4 0 0 0 0-7.6M1.8 1.8a8.8 8.8 0 0 0 0 12.4M14.2 14.2a8.8 8.8 0 0 0 0-12.4"/></symbol>
      <symbol id="i-activity" viewBox="0 0 16 16"><path d="M1.5 8.6h3l1.8-4.4 2.6 8 1.8-4.2h3.3"/></symbol>
      <symbol id="i-layers" viewBox="0 0 16 16"><path d="M8 1.8 14.4 5 8 8.2 1.6 5 8 1.8Z"/><path d="M1.6 8.4 8 11.6l6.4-3.2M1.6 11.4 8 14.6l6.4-3.2"/></symbol>
      <symbol id="i-system" viewBox="0 0 16 16"><rect x="1.6" y="2.4" width="12.8" height="8.4" rx="1.6"/><path d="M5.6 13.6h4.8"/></symbol>
      <symbol id="i-shield" viewBox="0 0 16 16"><path d="M8 1.6 13.6 3.6v4.2c0 3.2-2.2 5.6-5.6 6.8-3.4-1.2-5.6-3.6-5.6-6.8V3.6L8 1.6Z"/></symbol>
      <symbol id="i-widget" viewBox="0 0 16 16"><rect x="1.6" y="2.4" width="5.2" height="11.2" rx="1.4"/><rect x="8.4" y="2.4" width="6" height="5.2" rx="1.4"/><rect x="8.4" y="9.2" width="6" height="4.4" rx="1.4"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13.6 8a5.6 5.6 0 1 1-1.9-4.2"/><path d="M13.8 1.8v3.6h-3.6"/></symbol>
      <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></symbol>
      <symbol id="i-play" viewBox="0 0 16 16"><path d="M4.6 2.6 13 8l-8.4 5.4V2.6Z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.4 3v10M10.6 3v10"/></symbol>
      <symbol id="i-power" viewBox="0 0 16 16"><path d="M8 1.8v5.6"/><path d="M12 4.2a5.6 5.6 0 1 1-8 0"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 16 16"><path d="M9.2 1.6 3.6 9h3.6l-.4 5.4L12.4 7H8.8l.4-5.4Z"/></symbol>
      <symbol id="i-external" viewBox="0 0 16 16"><path d="M6.4 3.2H3.6A1.6 1.6 0 0 0 2 4.8v7.6a1.6 1.6 0 0 0 1.6 1.6h7.6a1.6 1.6 0 0 0 1.6-1.6v-2.8"/><path d="M9.4 2h4.6v4.6M13.4 2.6 7.2 8.8"/></symbol>
      <symbol id="i-close" viewBox="0 0 16 16"><path d="M3.6 3.6 12.4 12.4M12.4 3.6 3.6 12.4"/></symbol>
      <symbol id="i-min" viewBox="0 0 16 16"><path d="M3.4 8h9.2"/></symbol>
      <symbol id="i-max" viewBox="0 0 16 16"><rect x="3.4" y="3.4" width="9.2" height="9.2" rx="1.4"/></symbol>
      <symbol id="i-alert" viewBox="0 0 16 16"><path d="M8 2.2 14.4 13.4H1.6L8 2.2Z"/><path d="M8 6.2v3.4M8 11.6v.1"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 16 16"><path d="M5.6 3.6 10 8l-4.4 4.4"/></symbol>
      <symbol id="i-contrast" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><path style="fill:currentColor;stroke:none" d="M8 1.8a6.2 6.2 0 0 1 0 12.4z"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <header class="topbar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <span class="mark" aria-hidden="true"><svg><use href="#i-activity"/></svg></span>
        <span class="brand-text">
          <span class="brand-name">Tasma</span>
          <span class="brand-sub" id="brand-sub" data-tauri-drag-region>Your PC, at a glance</span>
        </span>
      </div>

      <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
        <button class="tab is-active" role="tab" aria-selected="true" data-view="overview">Overview</button>
        <button class="tab" role="tab" aria-selected="false" data-view="processes">Processes</button>
        <button class="tab" role="tab" aria-selected="false" data-view="cpu">CPU &amp; GPU</button>
        <button class="tab" role="tab" aria-selected="false" data-view="memory">Memory</button>
        <button class="tab" role="tab" aria-selected="false" data-view="network">Network</button>
        <button class="tab" role="tab" aria-selected="false" data-view="disk">Disk</button>
      </nav>

      <div class="chrome">
        <button class="icon-btn" id="btn-theme" type="button" title="Theme: system" aria-label="Theme: system"><svg><use href="#i-contrast"/></svg></button>
        <button class="icon-btn" id="btn-sample" type="button" title="Sample now" aria-label="Sample now"><svg><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="btn-compact" type="button" title="Compact widget, always on top" aria-label="Compact widget" aria-pressed="false"><svg><use href="#i-widget"/></svg></button>
        <span class="chrome-divider" aria-hidden="true"></span>
        <button class="icon-btn win" id="btn-min" type="button" aria-label="Minimise"><svg><use href="#i-min"/></svg></button>
        <button class="icon-btn win" id="btn-max" type="button" aria-label="Maximise"><svg><use href="#i-max"/></svg></button>
        <button class="icon-btn win close" id="btn-close" type="button" aria-label="Close"><svg><use href="#i-close"/></svg></button>
      </div>
    </header>

    <!-- Views are rendered from templates in app.js so the layout lives in one place. -->
    <main class="views" id="views"></main>

    <footer class="statusbar">
      <span class="status-left" id="status-left">Starting the sampler…</span>
      <span class="status-right">
        <button class="elevation" id="btn-elevate" type="button" hidden>
          <svg><use href="#i-shield"/></svg><span id="elevate-label">Standard user</span>
        </button>
        <label class="rate" for="rate-select">
          <span>Refresh</span>
          <select id="rate-select" aria-label="Refresh rate">
            <option value="500">0.5s</option>
            <option value="1000" selected>1s</option>
            <option value="2000">2s</option>
            <option value="5000">5s</option>
            <option value="0">Paused</option>
          </select>
        </label>
        <span class="version" id="status-version"></span>
      </span>
    </footer>
  </div>

  <aside class="drawer" id="drawer" hidden aria-label="Process details"></aside>
  <div class="ctx" id="ctx" role="menu" hidden></div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
